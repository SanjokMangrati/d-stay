# Local development dependencies. `pnpm install` + `docker compose up -d` +
# `pnpm --filter api db:migrate` + `pnpm --filter api db:seed` is the whole setup.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dstay
      POSTGRES_PASSWORD: dstay
      POSTGRES_DB: dstay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dstay -d dstay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
