# Local development dependencies. `pnpm install` + `docker compose up -d` +
# `pnpm --filter api db:migrate` + `pnpm --filter api db:seed` is the whole setup.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dstay
      POSTGRES_PASSWORD: dstay
      POSTGRES_DB: dstay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dstay -d dstay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for Cloudflare R2, which is S3-compatible: the API talks the S3
  # API to both, and only the endpoint and credentials differ between here and
  # production.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dstay
      MINIO_ROOT_PASSWORD: dstaydstay
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket and makes it read-public, because image URLs are handed
  # to browsers directly — R2 serves the same role through a public bucket URL.
  # Runs to completion and exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dstay dstaydstay &&
      mc mb --ignore-existing local/dstay-media &&
      mc anonymous set download local/dstay-media
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
