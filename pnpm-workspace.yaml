packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Telemetry postinstall pulled in transitively; nothing here needs it.
  '@scarf/scarf': false
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
  esbuild: true
  msw: true
  # Pulled in transitively by next-intl's tooling; nothing in the build path
  # calls either, so their native postinstalls are skipped.
  '@parcel/watcher': false
  '@swc/core': false
  # Testcontainers' Docker transport. It talks to a local daemon over a named
  # pipe or TCP, so the optional native SSH and CPU-feature builds are not used.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # BullMQ's optional native msgpack encoder. The JS fallback is what it ships
  # with, and job payloads here are a handful of ids.
  msgpackr-extract: false
